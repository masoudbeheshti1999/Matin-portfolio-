<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef4f8; --surface:#ffffff; --ink:#12222e; --muted:#51697a;
  --accent:#229ED9; --accent-ink:#ffffff; --ring:#bcd6e6;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1a23; --surface:#15262f; --ink:#e8f1f7; --muted:#9ab3c4; --ring:#27414f;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1a23; --surface:#15262f; --ink:#e8f1f7; --muted:#9ab3c4; --ring:#27414f;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Vazirmatn",Tahoma,"Segoe UI",sans-serif;
  display:flex; align-items:center; justify-content:center; padding:24px;
}
main{
  width:100%; max-width:480px; text-align:center;
  background:var(--surface); border:1px solid var(--ring); border-radius:20px;
  padding:48px 28px 40px;
}
.logo{width:96px;height:96px;display:block;margin:0 auto 28px}
h1{font-size:1.75rem;font-weight:800;margin:0 0 12px;line-height:1.5}
p{margin:0 0 28px;color:var(--muted);font-size:1.05rem;line-height:1.9}
a.btn{
  display:inline-flex; align-items:center; gap:10px; direction:ltr;
  background:var(--accent); color:var(--accent-ink); text-decoration:none;
  font-weight:600; font-size:1.2rem; padding:14px 28px; border-radius:999px;
}
a.btn:hover{filter:brightness(1.08)}
a.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
a.btn svg{width:24px;height:24px}
</style>
